<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#1a0e2a"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c674" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d4a657" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0612" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0a0612" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0612" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle starfield -->
  <g fill="#ede4d3">
    <circle cx="120"  cy="80"  r="1.5" opacity="0.5"/>
    <circle cx="240"  cy="140" r="1"   opacity="0.4"/>
    <circle cx="60"   cy="220" r="1.2" opacity="0.6"/>
    <circle cx="380"  cy="60"  r="1"   opacity="0.5"/>
    <circle cx="520"  cy="120" r="1.4" opacity="0.45"/>
    <circle cx="200"  cy="300" r="1"   opacity="0.4"/>
    <circle cx="90"   cy="400" r="1.3" opacity="0.6"/>
    <circle cx="160"  cy="500" r="1"   opacity="0.4"/>
    <circle cx="40"   cy="560" r="1.4" opacity="0.55"/>
    <circle cx="300"  cy="540" r="1"   opacity="0.4"/>
    <circle cx="430"  cy="490" r="1.2" opacity="0.5"/>
    <circle cx="620"  cy="540" r="1"   opacity="0.4"/>
    <circle cx="760"  cy="80"  r="1.3" opacity="0.55"/>
    <circle cx="880"  cy="160" r="1"   opacity="0.4"/>
    <circle cx="980"  cy="100" r="1.4" opacity="0.6"/>
    <circle cx="1080" cy="60"  r="1"   opacity="0.4"/>
    <circle cx="1140" cy="180" r="1.2" opacity="0.5"/>
    <circle cx="1060" cy="300" r="1"   opacity="0.4"/>
    <circle cx="1170" cy="380" r="1.3" opacity="0.55"/>
    <circle cx="970"  cy="540" r="1"   opacity="0.4"/>
    <circle cx="1100" cy="500" r="1.4" opacity="0.6"/>
    <circle cx="820"  cy="500" r="1"   opacity="0.4"/>
    <circle cx="900"  cy="580" r="1.2" opacity="0.45"/>
  </g>

  <!-- Gold stars -->
  <g fill="#f0c674">
    <circle cx="350"  cy="200" r="1.6" opacity="0.7"/>
    <circle cx="900"  cy="380" r="1.6" opacity="0.7"/>
    <circle cx="180"  cy="450" r="1.4" opacity="0.6"/>
  </g>

  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Top eyebrow line -->
  <text x="600" y="170" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="400" letter-spacing="12" fill="#ede4d3" fill-opacity="0.55" text-anchor="middle">EST. BY THE POSITION OF THINGS</text>

  <!-- Wordmark -->
  <text x="600" y="320" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="92" font-weight="500" letter-spacing="20" fill="url(#goldFade)" text-anchor="middle">K·I·S·M·E·T</text>

  <!-- Tagline -->
  <text x="600" y="410" font-family="'Cormorant Garamond', 'Fraunces', Georgia, serif" font-style="italic" font-size="42" fill="#ede4d3" fill-opacity="0.92" text-anchor="middle">The reading the algorithm wrote for you.</text>

  <!-- URL / footer -->
  <text x="600" y="540" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="500" letter-spacing="6" fill="#f0c674" fill-opacity="0.85" text-anchor="middle">kismet.cards</text>

  <!-- decorative glyph -->
  <text x="600" y="500" font-family="Georgia, serif" font-size="34" fill="#f0c674" fill-opacity="0.55" text-anchor="middle">⌬</text>

</svg>
